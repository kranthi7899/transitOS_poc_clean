<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="164" viewBox="0 0 1100 164" role="img" aria-labelledby="title desc"><title id="title">Synthetic fleet at a glance</title><desc id="desc">12 vehicles: 9 in service, 3 spares. 10 operators. 2 agencies. Deterministic seed with chaos modes.</desc><rect width="1100" height="164" rx="14" fill="#091b13"/><text x="30" y="65" fill="#b5ff7a" font-family="monospace" font-size="44" font-weight="bold">12</text><text x="110" y="54" fill="#e0eee4" font-family="monospace" font-size="15" letter-spacing="2">VEHICLES</text><text x="30" y="99" fill="#a5bfae" font-family="sans-serif" font-size="14">9 in service · 3 spares</text><path d="M360 30v78" stroke="#2b4e35"/><text x="395" y="65" fill="#b5ff7a" font-family="monospace" font-size="44" font-weight="bold">10</text><text x="475" y="54" fill="#e0eee4" font-family="monospace" font-size="15" letter-spacing="2">OPERATORS</text><text x="395" y="99" fill="#a5bfae" font-family="sans-serif" font-size="14">Hours + qualifications</text><path d="M725 30v78" stroke="#2b4e35"/><text x="760" y="65" fill="#b5ff7a" font-family="monospace" font-size="44" font-weight="bold">02</text><text x="840" y="54" fill="#e0eee4" font-family="monospace" font-size="15" letter-spacing="2">AGENCIES</text><text x="760" y="99" fill="#a5bfae" font-family="sans-serif" font-size="14">Separate native IDs</text><path d="M30 120h1040" stroke="#2b4e35"/><text x="30" y="145" fill="#95bb9f" font-family="monospace" font-size="12" letter-spacing="1">SIMULATED PRODUCTS / DETERMINISTIC SEED / CHAOS READY</text></svg>
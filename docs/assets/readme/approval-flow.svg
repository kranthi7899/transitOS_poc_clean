<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="174" viewBox="0 0 1100 174" role="img" aria-labelledby="title desc"><title id="title">Approval before action</title><desc id="desc">Evidence to code checks to proposal to human approval to controlled writes. Zero product writes before approval; current facts are checked again before execution.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5-7 3.5" fill="#78bb6c"/></marker></defs><rect width="1100" height="174" rx="14" fill="#091b13"/><text x="30" y="31" fill="#95bb9f" font-family="monospace" font-size="12" letter-spacing="2">THE GOVERNED PATH</text><rect x="30" y="53" width="184" height="68" rx="8" fill="#10271b" stroke="#345a3e"/><text x="42" y="79" fill="#daeadf" font-family="monospace" font-size="13">EVIDENCE</text><text x="42" y="102" fill="#a5bfae" font-family="sans-serif" font-size="12">Current product facts</text><path d="M219 87h19" stroke="#78bb6c" marker-end="url(#arrow)"/><rect x="244" y="53" width="184" height="68" rx="8" fill="#10271b" stroke="#345a3e"/><text x="256" y="79" fill="#daeadf" font-family="monospace" font-size="13">CODE CHECKS</text><text x="256" y="102" fill="#a5bfae" font-family="sans-serif" font-size="12">Hard limits + identity</text><path d="M433 87h19" stroke="#78bb6c" marker-end="url(#arrow)"/><rect x="458" y="53" width="184" height="68" rx="8" fill="#10271b" stroke="#345a3e"/><text x="470" y="79" fill="#daeadf" font-family="monospace" font-size="13">PROPOSAL</text><text x="470" y="102" fill="#a5bfae" font-family="sans-serif" font-size="12">Model or safe fallback</text><path d="M647 87h19" stroke="#78bb6c" marker-end="url(#arrow)"/><rect x="672" y="53" width="184" height="68" rx="8" fill="#183a22" stroke="#94de65"/><text x="684" y="79" fill="#b5ff7a" font-family="monospace" font-size="13">HUMAN APPROVAL</text><text x="684" y="102" fill="#a5bfae" font-family="sans-serif" font-size="12">Concrete plan decision</text><path d="M861 87h19" stroke="#78bb6c" marker-end="url(#arrow)"/><rect x="886" y="53" width="184" height="68" rx="8" fill="#10271b" stroke="#345a3e"/><text x="898" y="79" fill="#daeadf" font-family="monospace" font-size="13">CONTROLLED WRITES</text><text x="898" y="102" fill="#a5bfae" font-family="sans-serif" font-size="12">Recheck → act → audit</text><text x="30" y="151" fill="#a3e382" font-family="monospace" font-size="12">ZERO PRODUCT WRITES BEFORE APPROVAL</text><text x="1068" y="151" text-anchor="end" fill="#95bb9f" font-family="monospace" font-size="12">MEMORY IS CONTEXT · CODE IS THE SAFETY BOUNDARY</text></svg>
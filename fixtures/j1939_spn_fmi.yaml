# fixtures/j1939_spn_fmi.yaml
# ASSUMED (A115, A116). Hand-written in our own words; NOT the SAE J1939 table (that annex is paid and is not
# copied). The SPN numbers were listed in docs/RESEARCH_DATA_SOURCES.md section 4 (from a small MIT-licensed
# catalogue's README plus two DTC examples); names and systems below are our paraphrases and must be checked
# against a licensed annex before anyone relies on them. `name_confidence: unverified` marks rows whose meaning
# we did not see in a primary source in this session.
# Severity is a configurable RULE (severity_rule), never ground truth: an agency would tune it.
version: 1
fmi:
  # Failure mode identifiers, short paraphrases.
  0: "reading is valid but far above the normal range"
  1: "reading is valid but far below the normal range"
  2: "reading is erratic or inconsistent"
  3: "signal is stuck high (voltage above range)"
  4: "signal is stuck low (voltage below range)"
  5: "circuit is open or draws too little current"
  6: "circuit draws too much current or is shorted"
  7: "the component did not respond or move as commanded"
  31: "a condition exists (generic flag, no further detail)"
severity_rule:
  # Levels: monitor < service_soon < pull_vehicle. First matching override wins, else fmi_default, else default.
  default: monitor
  fmi_default:
    0: service_soon
    1: service_soon
    2: monitor
    3: service_soon
    4: service_soon
    5: monitor
    6: service_soon
    7: service_soon
    31: monitor
  overrides:
    - {spn: 110, fmi: 0, severity: pull_vehicle, why: "coolant far too hot: running on risks the engine"}
    - {spn: 100, fmi: 1, severity: pull_vehicle, why: "oil pressure far too low: running on risks the engine"}
    - {spn: 168, fmi: 1, severity: service_soon, why: "battery voltage low: may not restart"}
spn:
  - {spn: 110, name: "engine coolant temperature", system: engine_cooling, unit: degC, typical_fmi: [0, 3, 4], name_confidence: listed_in_research}
  - {spn: 168, name: "battery voltage (main)", system: electrical, unit: V, typical_fmi: [1, 3, 4], name_confidence: listed_in_research}
  - {spn: 96, name: "fuel tank level", system: engine, unit: percent, typical_fmi: [1, 3, 4], name_confidence: listed_in_research}
  - {spn: 190, name: "engine speed", system: engine, unit: rpm, typical_fmi: [0, 2], name_confidence: listed_in_research}
  - {spn: 513, name: "engine torque as a percent of maximum", system: engine, unit: percent, typical_fmi: [2, 31], name_confidence: listed_in_research}
  - {spn: 91, name: "accelerator pedal position", system: engine, unit: percent, typical_fmi: [2, 3, 4], name_confidence: listed_in_research}
  - {spn: 92, name: "engine load as a percent", system: engine, unit: percent, typical_fmi: [0, 2], name_confidence: listed_in_research}
  - {spn: 174, name: "fuel temperature", system: engine, unit: degC, typical_fmi: [0, 3, 4], name_confidence: listed_in_research}
  - {spn: 84, name: "road speed", system: transmission, unit: km_per_h, typical_fmi: [2, 31], name_confidence: listed_in_research}
  - {spn: 183, name: "fuel consumption rate", system: engine, unit: litres_per_h, typical_fmi: [2, 31], name_confidence: listed_in_research}
  - {spn: 1322, name: "engine misfire (DTC example)", system: engine, unit: none, typical_fmi: [31], example_dtc: true, example_fmi: 31, name_confidence: unverified}
  - {spn: 651, name: "fuel injector, cylinder 1 (DTC example)", system: engine, unit: none, typical_fmi: [7], example_dtc: true, example_fmi: 7, name_confidence: unverified}
  - {spn: 100, name: "engine oil pressure", system: engine, unit: kPa, typical_fmi: [1, 3, 4], name_confidence: unverified}
  - {spn: 105, name: "intake manifold temperature", system: engine, unit: degC, typical_fmi: [0, 3, 4], name_confidence: unverified}
  - {spn: 158, name: "battery voltage (switched by the key)", system: electrical, unit: V, typical_fmi: [1, 3, 4], name_confidence: unverified}

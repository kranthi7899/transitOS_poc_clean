# data/EXTRA_SOURCES.yaml
# Builder-owned additions to the hand-curated MANIFEST.yaml (which is never edited). Same schema. Every host here
# MUST already appear in MANIFEST.yaml (the fetcher refuses anything else). Reasons are in notes.
version: 1
datasets:
  - id: ecfr_565_15_api
    kind: api
    fetch: auto
    url: "https://www.ecfr.gov/api/versioner/v1/full/2026-10-01/title-49.xml?part=565&section=565.15"
    landing: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-V/part-565/subpart-B/section-565.15"
    format: xml
    license: "US Government work (public domain)"
    target_path: data/raw/regs/ecfr_565_15.xml
    used_for: "same as ecfr_565_15 (VIN check-digit rule); replaces it because the manifest HTML URL returns a bot-check page"
    notes: "Documented eCFR versioner API on the same host. Needs an Accept-Encoding that permits compression (httpx sends gzip)."
  - id: ecfr_395_5_api
    kind: api
    fetch: auto
    url: "https://www.ecfr.gov/api/versioner/v1/full/2026-10-01/title-49.xml?part=395&section=395.5"
    landing: "https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-395/subpart-A/section-395.5"
    format: xml
    license: "US Government work (public domain)"
    target_path: data/raw/regs/ecfr_395_5.xml
    used_for: "same as ecfr_395_5 (hours policy defaults)"
  - id: cincinnati_metadata
    kind: api
    fetch: auto
    url: "https://data.cincinnati-oh.gov/api/views/2a8x-bxjm.json"
    format: json
    license: null
    target_path: data/raw/cincinnati_wo/views_metadata.json
    used_for: "licence of the Cincinnati work-order dataset (Socrata licenseId)"
  - id: cincinnati_status_counts
    kind: api
    fetch: auto
    url: "https://data.cincinnati-oh.gov/resource/2a8x-bxjm.csv?$select=work_order_status,job_type,count(*)&$group=work_order_status,job_type&$limit=1000"
    format: csv
    license: null
    target_path: data/raw/cincinnati_wo/status_counts.csv
    used_for: "choose a safe subset query for repair durations"
  - id: cincinnati_closed_2022_2024
    kind: api
    fetch: auto
    url: "https://data.cincinnati-oh.gov/resource/2a8x-bxjm.csv?$select=job_type,work_order_status,datetime_open,datetime_first_labor,datetime_finished,datetime_closed,delay_hours,labor_hours,downtime_hrs_shop,reas_for_repair_desc&$where=datetime_open%20%3E=%20%272022-01-01T00:00:00%27%20AND%20datetime_open%20%3C%20%272025-01-01T00:00:00%27%20AND%20datetime_closed%20IS%20NOT%20NULL&$order=datetime_open&$limit=50000"
    format: csv
    license: null
    target_path: data/raw/cincinnati_wo/closed_2022_2024.csv
    used_for: "data/derived/repair_durations.yaml (shape of open-to-close times)"
    notes: "Capped at 50000 rows (one request). Closed work orders opened 2022-2024 only."
  - id: ntd_breakdowns_metadata
    kind: api
    fetch: auto
    url: "https://data.transportation.gov/api/views/amkt-4ehs.json"
    format: json
    license: null
    target_path: data/raw/ntd_breakdowns/amkt-4ehs_views_metadata.json
    used_for: "Socrata column descriptions: confirms what the _1/_2 columns mean"

    notes: "Probe first. Socrata export URL, column names and licence are all unverified. General city fleet, not transit buses: use shape, not absolute values. If unusable, use config/shop_behaviour.yaml (ASSUMED) and move on."
    verified: false

  - id: samsara_openapi
    kind: repo
    fetch: reference_only
    url: "https://github.com/samsarahq/api-docs"
    format: "git repo (swagger.json, OpenAPI 2.0)"
    license: null
    expected_size: null
    expected_rows: null
    target_path: data/raw/samsara_api_docs/

  - id: vpic_api
    kind: api
    fetch: reference_only
    url: "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/{VIN}?format=json"
    landing: "https://vpic.nhtsa.dot.gov/api/"

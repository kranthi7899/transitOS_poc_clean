# ---- time edges: touching blocks, midnight crossing ----------------------------------------------------------
- id: touching_blocks_share_a_spare_without_double_booking
  source: "P Review Focus 7: a spare may serve non-overlapping blocks (D A125: a block is [start, end), so end-to-start is not overlap)"
  option: {blocks: [[b1, 1, 2], [b2, 3, 2]], spares: [veh-2, veh-3], ready: 2, assign: [[b1, veh-2], [b2, veh-2]]}
  rule: double_booking
  expect: {status: pass, basis: native}
- id: touching_blocks_consume_one_spare
  source: "P Review Focus 7: one spare consumed"
  option: {blocks: [[b1, 1, 2], [b2, 3, 2]], spares: [veh-2, veh-3], ready: 2, assign: [[b1, veh-2], [b2, veh-2]]}
  rule: last_spare
  expect: {status: pass, basis: native}
- id: touching_blocks_same_operator_is_not_double_booked
  source: "P 1.3 double-booking + D A125"
  option: {blocks: [[b1, 1, 2, op-1], [b2, 3, 2, op-2]], spares: [veh-2], ready: 3, assign: [[b1, veh-2], [b2, veh-2, op-1]]}
  rule: double_booking
  expect: {status: pass, basis: native}
- id: midnight_block_is_expired_when_the_credential_expires_on_the_day_it_ends
  source: "P Review Focus 1 (violation on the day it expires) + A69 (the block's end day)"
  given: {block: {start_h: 17, hours: 4}, expires: {P: "2026-10-11"}}
  rule: operator_training_expiry
  expect: {status: violation, basis: native}
- id: midnight_block_passes_when_the_credential_outlives_it
  source: "P Review Focus 1 (converse)"
  given: {block: {start_h: 17, hours: 4}, expires: {P: "2026-10-12"}}
  rule: operator_training_expiry
  expect: {status: pass, basis: native}
- id: midnight_block_hours_count_in_full
  source: "A Q1 daily hours cap 10h: 6.5h + 4h block across midnight = 10.5h"
  given: {block: {start_h: 17, hours: 4}, operator: {hours_today: 6.5}}
  rule: operator_hours_day
  expect: {status: violation, basis: native}

# ---- F5: a kept operator who is also given another block accumulates both ----------------------------------
- id: kept_plus_new_block_breaks_daily_cap
  source: "R F5: sum every affected block the operator ends up on (kept plus newly assigned): 4h + 4h + 4h = 12h > 10h"
  option: {blocks: [[b1, 1, 4, op-1], [b2, 6, 4, op-2]], spares: [veh-2], ready: 4, assign: [[b1, veh-2], [b2, veh-2, op-1]], operator: {hours_today: 4.0}}
  rule: operator_hours_day
  expect: {status: violation, basis: native}
- id: kept_plus_new_block_breaks_weekly_cap
  source: "R F5 + P D-1 weekly 70h: 64h + 4h + 4h = 72h"
  option: {blocks: [[b1, 1, 4, op-1], [b2, 6, 4, op-2]], spares: [veh-2], ready: 4, assign: [[b1, veh-2], [b2, veh-2, op-1]], operator: {hours_today: 1.0, hours_week: 64.0}}
  rule: operator_hours_week
  expect: {status: violation, basis: native}
- id: kept_plus_new_block_within_caps_is_not_excluded
  source: "R F5 (converse): 2h + 4h + 4h = 10h, not above the cap"
  option: {blocks: [[b1, 1, 4, op-1], [b2, 6, 4, op-2]], spares: [veh-2], ready: 4, assign: [[b1, veh-2], [b2, veh-2, op-1]], operator: {hours_today: 2.0}}
  expect: {excluded: false}

# ---- operator overlapping a commitment -----------------------------------------------------------------------
- id: kept_operator_overlapping_another_commitment_is_double_booking
  source: "A Q1: double-booking is a hard rule (operator side)"
  option: {blocks: [[b1, 1, 2, op-1]], spares: [veh-2], ready: 3, assign: [[b1, veh-2]], commitments: {"operator:op-1": [[2, 4, other]]}}
  rule: double_booking
  expect: {status: violation, basis: native}
- id: new_operator_overlapping_another_commitment_is_double_booking
  source: "A Q1: double-booking"
  option: {blocks: [[b1, 1, 2, op-1]], spares: [veh-2], ready: 3, assign: [[b1, veh-2, op-2]], commitments: {"operator:op-2": [[0, 1.5, other]]}}
  rule: double_booking
  expect: {status: violation, basis: native}
- id: option_naming_an_operator_outside_the_eligible_list_is_excluded
  source: "A Q1 / CLAUDE.md rule 3: hard limits are code; a model-named operator not on the code-built list is refused"
  option: {blocks: [[b1, 1, 2, op-1]], spares: [veh-2], ready: 3, assign: [[b1, veh-2, op-9]], absent_operators: [op-9]}
  rule: operator_eligible
  expect: {status: violation, basis: native}
- id: an_exception_inside_clearance_excludes_the_option
  source: "A Q2: fail closed on bugs or exceptions inside clearance (a zone-less time cannot be compared)"
  option: {blocks: [[b1, 1, 2, op-1]], spares: [veh-2], ready: 3, assign: [[b1, veh-2]], operators: {op-1: {available_from: "2026-10-10T05:00:00"}}}
  rule: clearance_error
  expect: {status: violation, basis: unknown}


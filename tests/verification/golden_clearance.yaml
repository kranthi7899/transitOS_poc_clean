# Golden table for the clearance rules. Every row is derived from the POLICY TEXT, not from the code:
#   A  = docs/phases/PHASE-10-amendment-A.md (Q1 vehicle fit, Q2 one module, Q3 missing data, Ranking)
#   P  = docs/superpowers/plans/2026-10-11-realistic-fleet-and-world.md (Amendment A table, rule classification,
#        Review Focus, Step 1 tasks 1.1-1.4)
#   D  = a decision the policy text leaves open, recorded as an assumption (id in `source`)
# `given` is a tiny DSL (extra keys: operator_window_h [from, to] hours after 06:00; operator.last_duty_end_h) read by tests/verification/test_golden_clearance.py:
#   block:    needs overrides (type, seats, wheelchair_positions, lift, max_vehicle_length_ft), start_h, hours
#   vehicle:  Vehicle field overrides      operator: Operator field overrides (dates as YYYY-MM-DD)
#   expires:  {credential: date}           the block day is 2026-10-10
#   drop:     capability-profile fields the product does not supply (workforce or scheduling)
#   legacy:   true -> only the legacy `qualifications` list is supplied
#   policy:   AgencyPolicy overrides (vehicle_fit, limits.*)
#   operator_unknown / vehicle_unknown / needs_unknown: contract field names listed in that record's
#             `unknown_fields` (C-2: the cell was blank or the key absent for THIS record)
#   operator: duty_start_today_h, last_duty_end_h (hours after 06:00); medical_valid_to as a date
#   option:   blocks [[id, start_h, hours, current_operator]], assign [[block, spare, new_operator]],
#             operators {op-id: overrides} (per operator, on top of `operator`), commitments {"vehicle:<id>" |
#             "operator:<id>": [[start_h, end_h, block]]}
# `expect.absent: true` means the rule must produce no item at all.
# `expect.status` / `basis` / `requires_ack` are compared with the item named by `rule`.

# ---- Q1: vehicle type is graded ------------------------------------------------------------------------
- id: fit_exact_is_best
  source: "A Q1: exact type is the best tier"
  rule: vehicle_fit
  expect: {status: pass, basis: native}
- id: fit_larger_is_warning_needing_ack
  source: "A Q1: a larger class is a fallback tier: allowed, shown as a warning, needs approver acknowledgement"
  given: {vehicle: {type: articulated}}
  rule: vehicle_fit
  expect: {status: warn, basis: native, requires_ack: true}
- id: fit_smaller_never_a_candidate
  source: "A Q1: a smaller class is never a candidate"
  given: {block: {type: articulated}, vehicle: {type: standard}}
  rule: vehicle_fit
  expect: {status: violation}
- id: fit_exact_setting_excludes_larger
  source: "A Q1: agency setting vehicle_fit exact | allow_larger; P table: larger = violation under exact"
  given: {vehicle: {type: articulated}, policy: {vehicle_fit: exact}}
  rule: vehicle_fit
  expect: {status: violation}
- id: fit_default_setting_allows_larger
  source: "A Q1: default allow_larger"
  given: {vehicle: {type: articulated}, policy: {vehicle_fit: allow_larger}}
  rule: vehicle_fit
  expect: {status: warn}
- id: length_declared_restriction_blocks_larger
  source: "A Q1: a block restriction (maximum vehicle length) that a larger vehicle violates is a hard block"
  given: {block: {max_vehicle_length_ft: 45}, vehicle: {type: articulated, length_ft: 60}}
  rule: vehicle_length
  expect: {status: violation, basis: native}
- id: length_within_restriction_passes
  source: "A Q1 (converse)"
  given: {block: {max_vehicle_length_ft: 45}, vehicle: {type: standard, length_ft: 40}}
  rule: vehicle_length
  expect: {status: pass, basis: native}
- id: length_missing_uses_tagged_default
  source: "A Q3: resolution order native, derived, agency default tagged ASSUMED, unknown"
  given: {block: {max_vehicle_length_ft: 45}, vehicle: {type: standard}}
  rule: vehicle_length
  expect: {status: pass, basis: assumed}
- id: length_assumed_breach_is_visible
  source: "D A70: a breach on an assumed default excludes, and says it is assumed"
  given: {block: {max_vehicle_length_ft: 45}, vehicle: {type: articulated}}
  rule: vehicle_length
  expect: {status: violation, basis: assumed}
- id: length_nothing_to_go_on_is_unverifiable
  source: "A Q3: unknown on a safety rule = unverifiable"
  given: {block: {max_vehicle_length_ft: 45, type: null}, vehicle: {type: mystery}}
  rule: vehicle_length
  expect: {status: unverifiable, basis: unknown, requires_ack: true}


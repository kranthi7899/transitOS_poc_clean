# ---- option-level: spares (Review Focus 7), double-booking, kill switch ---------------------------------
- id: spare_reused_non_overlapping_is_one_spare
  source: "P Review Focus 7 / 1.3: a spare may serve several non-overlapping blocks; last-spare counts distinct spares"
  option: {blocks: [[b1, 1, 2], [b2, 4, 2]], spares: [veh-2, veh-3], ready: 2, assign: [[b1, veh-2], [b2, veh-2]]}
  rule: last_spare
  expect: {status: pass}
- id: spare_reused_non_overlapping_option_not_excluded
  source: "P Review Focus 7: one spare consumed"
  option: {blocks: [[b1, 1, 2], [b2, 4, 2]], spares: [veh-2, veh-3], ready: 2, assign: [[b1, veh-2], [b2, veh-2]]}
  expect: {excluded: false}
- id: spare_reused_overlapping_is_violation
  source: "P Review Focus 7: across two overlapping blocks it is a violation"
  option: {blocks: [[b1, 1, 3], [b2, 2, 3]], spares: [veh-2, veh-3], ready: 3, assign: [[b1, veh-2], [b2, veh-2]]}
  rule: double_booking
  expect: {status: violation}
- id: two_distinct_spares_leave_too_few
  source: "P 1.3 / A25: last-spare rule on distinct spares: 2 ready - 2 used = 0 < min_spares 1"
  option: {blocks: [[b1, 1, 2], [b2, 4, 2]], spares: [veh-2, veh-3], ready: 2, assign: [[b1, veh-2], [b2, veh-3]]}
  rule: last_spare
  expect: {status: violation}
- id: last_spare_one_ready_one_used
  source: "A Q1: last-spare rule"
  option: {blocks: [[b1, 1, 2]], spares: [veh-2], ready: 1, assign: [[b1, veh-2]]}
  rule: last_spare
  expect: {status: violation}
- id: ready_count_unknown_is_unverifiable
  source: "A Q3"
  option: {blocks: [[b1, 1, 2]], spares: [veh-2], ready: null, assign: [[b1, veh-2]]}
  rule: last_spare
  expect: {status: unverifiable, basis: unknown, requires_ack: true}
- id: commitments_overlap_is_double_booking
  source: "A Q1: double-booking is a hard rule"
  option: {blocks: [[b1, 1, 2]], spares: [veh-2], ready: 3, assign: [[b1, veh-2]], commitments: {"vehicle:veh-2": [[2, 4, other]]}}
  rule: double_booking
  expect: {status: violation, basis: native}
- id: schedule_feed_missing_fails_closed
  source: "P table: double-booking fails closed"
  option: {blocks: [[b1, 1, 2]], spares: [veh-2], ready: 3, assign: [[b1, veh-2]], commitments: null}
  rule: double_booking
  expect: {status: violation, basis: unknown}
- id: operator_hours_accumulate_over_new_blocks
  source: "P 1.3: hours caps (a newly assigned operator takes both blocks)"
  option: {blocks: [[b1, 1, 3, op-0], [b2, 5, 3, op-0]], spares: [veh-2], ready: 4, assign: [[b1, veh-2, op-1], [b2, veh-2, op-1]], operator: {hours_today: 4.5}}
  rule: operator_hours_day
  expect: {status: violation}
- id: kill_switch_fails_closed
  source: "P table: kill switch fails closed"
  kill_switch: true
  rule: kill_switch
  expect: {status: violation}
- id: kill_switch_off_passes
  source: "P table"
  kill_switch: false
  rule: kill_switch
  expect: {status: pass}

# =========================================================================================================
# Step 1b rows (reviewer R1 findings F2, F3, F5, F7, F8; supervisor rulings). Written from the policy text
#   R  = supervisor rulings for Step 1b (F2 per-field qualification, F3 per-row unknown via C-2, F5 kept plus
#        new hours, F8 medical card is a legal rule)
#   C2 = coordination/requests/C-2.md (per-row unknown_fields)
# before the code that implements them existed.
# =========================================================================================================


  expect: {status: unverifiable, basis: unknown, requires_ack: true}

# ---- hours (P: daily and weekly 8-day window; Step 1 task 1.3) --------------------------------------------
- id: daily_cap_exceeded
  source: "A Q1: known legal hours cap; AgencyPolicy limit 10h"
  given: {operator: {hours_today: 6.5}, block: {hours: 4}}
  rule: operator_hours_day
  expect: {status: violation}
- id: daily_cap_met_exactly_is_allowed
  source: "P 1.3: cap (a total equal to the limit does not exceed it)"
  given: {operator: {hours_today: 6.0}, block: {hours: 4}}
  rule: operator_hours_day
  expect: {status: pass, basis: native}
- id: weekly_cap_exceeded
  source: "P D-1: max_operator_hours_week 70 over an 8-day window"
  given: {operator: {hours_week: 67.0}, block: {hours: 4}}
  rule: operator_hours_week
  expect: {status: violation}
- id: weekly_cap_met_exactly_is_allowed
  source: "P D-1: 66 + 4 = 70, not above the cap"
  given: {operator: {hours_week: 66.0}, block: {hours: 4}}
  rule: operator_hours_week
  expect: {status: pass}
- id: weekly_hours_unknown_is_unverifiable
  source: "A Q3: unknown on a legal rule = unverifiable"
  given: {operator: {hours_week: 0.0}, drop: [hours_week]}
  rule: operator_hours_week
  expect: {status: unverifiable, basis: unknown, requires_ack: true}
- id: weekly_hours_unknown_but_lower_bound_breaks_cap_is_derived_violation
  source: "A Q3: derived from other data (today's hours are part of the week)"
  given: {operator: {hours_today: 9.0}, drop: [hours_week], policy: {limits: {max_operator_hours_week: 12, max_operator_hours_day: 20}}, block: {hours: 4}}
  rule: operator_hours_week
  expect: {status: violation, basis: derived}
- id: daily_hours_unknown_is_unverifiable
  source: "A Q3"
  given: {drop: [hours_today]}
  rule: operator_hours_day
  expect: {status: unverifiable, basis: unknown, requires_ack: true}


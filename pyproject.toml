[project]
name = "transitos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "langgraph>=0.2", "langgraph-checkpoint-sqlite>=2.0", "pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "transitos"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
databricks = [
    "databricks-sql-connector>=4.0,<5",
]
kafka = [
    "confluent-kafka>=2.6",
]
data = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
postgres = [
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
]
llm = [
    "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "openai_live: opt-in paid OpenAI one-scenario rehearsal; TRANSITOS_LIVE_OPENAI=1, cumulative app cap $0.50",
    "kafka: needs a reachable Kafka broker (auto-skipped unless 127.0.0.1:9092 answers or TRANSITOS_KAFKA is set)",
    "kafka_admin: also stops/starts the project-local broker via scripts/kafka.sh (needs TRANSITOS_KAFKA_ADMIN=1)",
    "postgres: needs a reachable Postgres (auto-skipped unless 127.0.0.1:54329 answers or TRANSITOS_PG is set)",
    "llm_live: calls the real Claude API (Haiku only, tiny cost); needs TRANSITOS_LIVE_LLM=1 and ANTHROPIC_API_KEY",
    "postgres_admin: also stops/starts the project-local server via scripts/postgres.sh (needs TRANSITOS_PG_ADMIN=1)",
]
